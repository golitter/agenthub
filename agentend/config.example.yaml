# AgentEnd 配置示例。复制为 config.yaml 后按实际环境填写。
server:
  host: "0.0.0.0"
  port: 8001
  reload: true
  cors:
    origins:
      - "*"
    credentials: true
    methods:
      - "*"
    headers:
      - "*"

app:
  title: "AgentEnd Runtime"
  version: "0.1.0"

workspace:
  base_dir: "./worktrees"
  cleanup_interval: 7200
  store_path: "logs/workspaces.json"
  git_default_branch: "main"

session:
  store_path: "logs/session_mappings.json"

database:
  host: "127.0.0.1"
  port: 3306
  user: "root"
  password: ""
  dbname: "agenthub"

execution:
  max_turns: 20
  timeout: 300
  process_terminate_timeout: 5.0
  run_store_path: "logs/runs.sqlite3"
  max_concurrent_runs: 4
  sandbox:
    mode: "unsafe_process"
    backend: "unsafe_process"

security:
  service_auth_enabled: false
  allowed_repo_roots: []
  allow_unsafe_local_execution: true

backend:
  url: "http://localhost:8080"

skills:
  builtin_dir: "src/skills/builtin"
  block_marker: "aka_yhy"
  manifest:
    taskctl:
      file:
        - SKILL.md
        - taskctl
    render:
      file:
        - SKILL.md
        - render

orchestrator:
  llm_request_timeout: 1200.0
  ask_agent_timeout: 180.0
  ask_agent_stream_chunk_timeout: 60.0
  reason_max_iterations: 60
  replan_max_iterations: 3
  skill_execution_timeout: 30.0
  execution_retry_max_attempts: 2
  conflict_resolver_enabled: true
  conflict_resolver_max_attempts: 2
  conflict_resolver_timeout: 600.0
  conflict_auto_resolve_text: true
  conflict_auto_resolve_binary: false
  integration_result_v2_write_enabled: true
  integration_service_execute_enabled: false

llm: {}

agents:
  claude-code:
    config_path: ""
  opencode:
    config_path: ""
  codex:
    config_path: ""
  pi:
    config_path: ""
  orchestrator:
    config_path: ""
