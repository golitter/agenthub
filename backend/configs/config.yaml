mysql:
  host: 127.0.0.1
  port: 3306
  user: root
  password: "123456"
  dbname: agenthub
  charset: utf8mb4

jwt:
  secret: agenthub-demo-secret
  expire_hours: 24

agentend:
  host: http://localhost
  port: 8001
  service_auth_enabled: false

server:
  port: 8080

auth:
  enabled: false

redis:
  host: 127.0.0.1
  port: 6379
  password: ""
  db: 0

admin:
  # Plaintext password. For production, replace with bcrypt hash (prefix $2a$ or $2b$).
  # Generate: htpasswd -nbBC 10 "" "your-password" | tr -d ':\n' | sed 's/$2y/$2a/'
  password: "123456"

storage:
  write_provider: minio
  minio:
    enabled: true
    endpoint: 127.0.0.1:19000
    bucket: agenthub-assets
    access_key: ""
    secret_key: ""
    use_ssl: false
    ca_file: ""
    request_timeout: 10s
  local:
    enabled: true
    dir: "./uploads"
    url_prefix: "/uploads"

artifact_storage:
  enabled: false
  endpoint: 127.0.0.1:19000
  bucket: agenthub-artifacts
  access_key: ""
  secret_key: ""
  use_ssl: false
  ca_file: ""
  request_timeout: 15s
  max_object_size: 25MiB
  max_artifacts_per_message: 20
  upload_token_ttl: 30m
  capability_secret: ""
  failed_retention: 24h

skill_storage:
  enabled: true
  require_admin: true
  type: minio
  endpoint: 127.0.0.1:19000
  bucket: skill-packages
  use_ssl: false
  ca_file: ""
  upload_session_ttl: 15m
  receipt_retention: 720h
  read_preference: minio
  shadow_write_blob: true
  allow_legacy_tmp_confirm: true
  confirm_lease: 2m
  orphan_grace_period: 48h
  incoming_ttl: 24h
  temp_dir: ./data/skill-tmp
  min_temp_free_bytes: 1GiB
  max_upload_size: 10MiB
  max_package_size: 12MiB
  max_file_size: 10MiB
  max_unpacked_size: 50MiB
  max_compression_ratio: 100
  max_file_count: 200
  max_concurrent_validations: 4
  validation_timeout: 2m
  reject_binaries: false
  reject_executables: false
  content_scan_command: ""
  content_scan_timeout: 2m

cors:
  allow_origins:
    - "http://localhost:5173"
