# StreamEvent 事件类型枚举及 StreamEvent 数据结构
# 三端（Python/TypeScript/Go）的类型定义均由此文件生成
$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "event-types.yaml"
title: "EventTypes"

definitions:
  EventType:
    title: "EventType"
    type: string
    description: "SSE 流事件类型枚举"
    enum:
      - init                  # 会话初始化事件
      - text                  # 可见聊天文本；group_id + message_id 表示群成员独立 IM 消息
      - tool_call             # 工具调用开始
      - tool_result           # 工具调用结果返回
      - artifact              # 产出物（文件/代码等）
      - planning              # 规划/思考过程
      - plan_review           # Orchestrator 规划审查请求
      - done                  # 流结束
      - error                 # 错误事件
      - heartbeat             # 保活心跳事件
      - runtime_executing     # Agent 开始执行任务
      - runtime_text          # 运行卡片增量日志（兼容旧事件，不用于子 Agent 聊天回复）
      - runtime_completed     # Agent 完成任务
      - coordination_start    # 协调通道开启
      - coordination_message  # 协调消息（项目经理 ↔ Agent）
      - coordination_done     # 协调通道关闭
      - ask_card_start        # Orchestrator 向子 Agent 发起提问
      - ask_card_done         # 子 Agent 回答完成，更新提问卡片状态
      - integration_started   # Agent 产物开始合入 task 分支
      - integration_completed # Agent 产物已成功合入 task 分支
      - integration_conflict  # 结构化 Git 冲突事实
      - resolution_started    # Resolver attempt 开始
      - resolution_progress   # Resolver 修复/验证进度
      - resolution_completed  # Resolver 结果已合入 task 分支
      - resolution_failed     # Resolver attempt 失败
      - orchestrator_paused   # 自动恢复耗尽，等待人工处理

  StreamEvent:
    title: "StreamEvent"
    type: object
    description: "SSE 流事件数据结构"
    properties:
      type:
        $ref: "#/definitions/EventType"
        description: "事件类型"
      content:
        type: object
        additionalProperties: true
        default: {}
        description: "事件内容，具体字段随 type 而异"
      timestamp:
        type: number
        description: "Unix 时间戳（秒，含小数）"
    required:
      - type
