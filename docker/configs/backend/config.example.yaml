# Docker Backend 配置示例。复制为 config.yaml 后按部署环境填写。
mysql:
  host: mysql
  port: 3306
  user: root
  password: ""
  dbname: agenthub
  charset: utf8mb4

jwt:
  secret: ""
  expire_hours: 24

agentend:
  host: http://host.docker.internal
  port: 8001

server:
  port: 8080

auth:
  enabled: false

redis:
  host: redis
  port: 6379
  password: ""
  db: 0

admin:
  password: ""

qiniu:
  bucket: ""
  domain: ""
  region: z0

cors:
  allow_origins:
    - "http://localhost"
    - "http://localhost:8787"
