# Docker Backend 配置示例。复制为 config.yaml 后按部署环境填写。
mysql:
  host: mysql
  port: 3306
  user: root
  password: ""
  dbname: agenthub
  charset: utf8mb4

jwt:
  secret: ""
  expire_hours: 24

agentend:
  host: http://host.docker.internal
  port: 8001

server:
  port: 8080

auth:
  enabled: false

redis:
  host: redis
  port: 6379
  password: ""
  db: 0

admin:
  password: ""

qiniu:
  bucket: ""
  domain: ""
  region: z0

skill_storage:
  enabled: false
  require_admin: true
  type: minio
  endpoint: minio:9000
  bucket: skill-packages
  access_key: ""
  secret_key: ""
  use_ssl: false
  ca_file: ""
  upload_session_ttl: 15m
  receipt_retention: 720h
  read_preference: minio
  shadow_write_blob: true
  allow_legacy_tmp_confirm: true
  confirm_lease: 2m
  orphan_grace_period: 48h
  incoming_ttl: 24h
  temp_dir: /var/lib/agenthub/skill-tmp
  min_temp_free_bytes: 1GiB
  max_upload_size: 10MiB
  max_package_size: 12MiB
  max_file_size: 10MiB
  max_unpacked_size: 50MiB
  max_compression_ratio: 100
  max_file_count: 200
  max_concurrent_validations: 4
  validation_timeout: 2m
  reject_binaries: false
  reject_executables: false
  content_scan_command: ""
  content_scan_timeout: 2m

cors:
  allow_origins:
    - "http://localhost"
    - "http://localhost:8787"
